<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MyCalorieDoctor is temporarily unavailable due to an internal issue."
    />
    <title>Not Found | MyCalorieDoctor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f9f9f9;
        color: #1a1c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #fff7f2 0%, #f9f9f9 100%);
      }

      .card {
        max-width: 560px;
        width: 100%;
        padding: 40px 32px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(26, 28, 28, 0.08);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #ffede3;
        color: #aa3700;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #59413a;
        font-size: 1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge">Temporary Notice</div>
      <h1>Not Found</h1>
      <p>The page you requested is currently unavailable due to an internal issue. Please try again shortly.</p>
